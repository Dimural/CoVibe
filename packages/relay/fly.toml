app = "covibes-relay"
primary_region = "ord"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/healthz"

[env]
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  MAX_PARTICIPANTS = "4"
  SESSION_GRACE_MS = "1800000"
  # REDIS_URL and SENTRY_DSN are secrets — set via: flyctl secrets set REDIS_URL='...' --app covibes-relay

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
